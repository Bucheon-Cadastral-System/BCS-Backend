plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.is'
version = '0.0.1-SNAPSHOT'
description = 'bcs'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    // 그레이들이 딸려 주는 판이 JDK 를 못 따라오면 클래스 파일을 못 읽어 커버리지가 0 으로 잡힌다.
    // 툴 버전은 그레이들과 따로 올릴 수 있으므로 여기서 직접 못을 박는다.
    toolVersion = '0.8.15'
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 운영 지표 — http.server.requests 로 엔드포인트별 지연 분포를 남긴다.
    // 레지스트리는 실행에만 필요하고 우리 코드가 API 를 직접 부르지 않으므로 runtimeOnly 로 둔다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Caffeine Cache (카페인 캐시)
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // 좌표 변환 (TM 성과 → 경위도) — 순수 Java 라 DB·네이티브 의존 없이 단위 테스트로 검증된다
    implementation 'org.locationtech.proj4j:proj4j:1.4.3'

    // 엑셀(xlsx) 읽기 — 대상지 파일이 CSV 로도 XLSX 로도 온다
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // QueryDSL — 본가(com.querydsl)는 2024년 5.1.0 이후 멈춰 최신 Hibernate 를 따라오지 못한다.
    // 유지보수가 이어지는 OpenFeign 배포본을 쓴다. 패키지 이름은 com.querydsl.* 그대로라 코드는 달라지지 않는다.
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:7.5:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    //Swagger UI :  http://localhost:8080/swagger-ui/index.html#/
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Spring AI (챗봇: ChatClient + 도구 호출) — 모델은 Gemini(OpenAI 호환 엔드포인트)라 OpenAI 스타터 사용
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 통합 테스트는 각자 데이터를 넣으므로 기동 시드(DogeunSeedRunner)를 꺼 커밋된 시드가 개수 단언을 오염시키지 않게 한다
    systemProperty 'bcs.seed.enabled', 'false'
    finalizedBy tasks.named('jacocoTestReport')
}

/**
 * 커버리지 계산에서 뺄 것 — 생성 코드·부팅 진입점과, 인증/회원 축.
 * 인증 쪽은 다른 담당자가 작업 중이라 테스트도 그쪽에서 붙는다. 그 작업이 들어오면 이 목록에서 지울 것.
 */
def coverageExclusions = [
        'com/is/bcs/BcsApplication.class',
        // QueryDSL 이 엔티티 옆에 만드는 클래스. 대상을 좁혀 두어야 Q 로 시작하는 일반 클래스가 함께 빠지지 않는다
        'com/is/bcs/adapter/out/persistence/**/Q*.class',

        'com/is/bcs/adapter/in/security/**',
        'com/is/bcs/adapter/in/auth/**',
        'com/is/bcs/adapter/out/security/**',
        'com/is/bcs/adapter/out/token/**',
        'com/is/bcs/adapter/out/persistence/member/**',
        'com/is/bcs/application/service/auth/**',
        'com/is/bcs/application/service/oauth/**',
        'com/is/bcs/application/port/in/auth/**',
        'com/is/bcs/application/port/out/token/**',
        'com/is/bcs/application/port/out/member/**',
        'com/is/bcs/domain/token/**',
        'com/is/bcs/domain/member/**'
]

tasks.named('jacocoTestReport') {
    // test 를 dependsOn 하면 실패한 테스트가 있을 때 리포트까지 건너뛴다 — 순서는 finalizedBy 가 잡는다
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
}

tasks.named('jacocoTestCoverageVerification') {
    // check 는 둘 다 포함하지만 순서는 보장하지 않는다 — 실행 데이터가 없는 채로 검증하지 않게 잡는다.
    // dependsOn 이 아니라 mustRunAfter 라 테스트를 다시 돌리지 않고 기존 데이터로 확인할 수도 있다.
    mustRunAfter tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
