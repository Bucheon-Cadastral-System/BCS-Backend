# 상태 기반 표준 detail 문구(ErrorDetailResolver) — advice fallback · /error 정규화 · 보안 핸들러 공용.
# 키 없는 status는 상태군 공통 문구로 폴백. 새 status 문구는 여기 한 줄로 추가(코드 불변).
error.401=인증이 필요합니다
error.403=권한이 없습니다
error.404=요청한 리소스를 찾을 수 없습니다
error.405=허용되지 않은 메서드입니다
error.413=요청 본문이 허용 크기를 초과했습니다
error.415=지원하지 않는 미디어 타입입니다
