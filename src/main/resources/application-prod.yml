server:
  forward-headers-strategy: framework

  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: bcs

  threads:
    virtual:
      enabled: true # 가상 스레드 On

  mvc:
    problemdetails:
      enabled: true # Spring 기본 예외도 ProblemDetail로 응답

  # 대상지 파일 업로드 — 기본값(파일 1MB·요청 10MB)은 2천 점짜리 대상지에 못 미친다
  servlet:
    multipart:
      max-file-size: 20MB
      # 요청 한도에는 파일 외에 경계 문자열·파트 헤더·조사명 같은 파라미터도 들어간다
      max-request-size: 25MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        # 배치로 묶은 INSERT 를 드라이버가 한 문장(VALUES 여러 벌)으로 다시 쓴다 — 임포트가 수천 행을 넣는다
        reWriteBatchedInserts: true

  jpa:
    open-in-view: false
    hibernate:
      # 아직 운영 개시 전이라 재기동 때 스키마를 다시 만든다.
      # 실제 성과 데이터가 들어가는 시점에 반드시 validate 로 바꾸고 스키마 변경은 마이그레이션으로 적용할 것.
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        default_schema: bcs
        format_sql: true
        use_sql_comments: true
        # 대상지 파일 임포트는 한 번에 수천 행을 넣는다 — 묶어 보내지 않으면 행마다 왕복한다
        order_inserts: true
        order_updates: true
        hbm2ddl:
          create_namespaces: true
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 100

  jackson:
    time-zone: Asia/Seoul

  ai:
    retry:
      max-attempts: 1
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash-lite
          # temperature/top_p/top_k은 Gemini 3.x에서 사용하지 않음
          max-tokens: 2048

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s

  security:
    oauth2:
      client:
        registration:
          kakao: # registrationId
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://bcs.inwoohub.com/login/oauth2/code/{registrationId}"
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# Swagger
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    url: /v3/api-docs
    config-url: /v3/api-docs/swagger-config

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    root: info

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://bcs.inwoohub.com}
  backend-base-url: ${BACKEND_BASE_URL:https://bcs.inwoohub.com}

  image-upload:
    # 컨테이너 내부 경로다. Ubuntu 호스트 경로는 Docker 볼륨으로 연결한다.
    root-directory: ${BCS_UPLOAD_DIR:/app/uploads}
    max-file-size: ${BCS_IMAGE_MAX_SIZE:5MB}
    max-width: ${BCS_IMAGE_MAX_WIDTH:12000}
    max-height: ${BCS_IMAGE_MAX_HEIGHT:12000}
    webp-info-command: ${BCS_WEBPINFO_COMMAND:webpinfo}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 14d

  auth:
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Lax
      path: /api/auth

    oauth:
      exchange-code-ttl: 60s