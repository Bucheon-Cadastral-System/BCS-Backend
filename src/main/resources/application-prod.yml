server:
  forward-headers-strategy: framework

  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: bcs

  threads:
    virtual:
      enabled: true # 가상 스레드 On

  mvc:
    problemdetails:
      enabled: true # Spring 기본 예외도 ProblemDetail로 응답

  # 대상지 파일 업로드 — 기본값(파일 1MB·요청 10MB)은 2천 점짜리 대상지에 못 미친다
  servlet:
    multipart:
      max-file-size: 20MB
      # 요청 한도에는 파일 외에 경계 문자열·파트 헤더·조사명 같은 파라미터도 들어간다
      max-request-size: 25MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        # 배치로 묶은 INSERT 를 드라이버가 한 문장(VALUES 여러 벌)으로 다시 쓴다 — 임포트가 수천 행을 넣는다
        reWriteBatchedInserts: true

  jpa:
    open-in-view: false
    hibernate:
      # 아직 운영 개시 전이라 재기동 때 스키마를 다시 만든다.
      # 실제 성과 데이터가 들어가는 시점에 반드시 validate 로 바꾸고 스키마 변경은 마이그레이션으로 적용할 것.
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        default_schema: bcs
        format_sql: true
        use_sql_comments: true
        # 대상지 파일 임포트는 한 번에 수천 행을 넣는다 — 묶어 보내지 않으면 행마다 왕복한다
        order_inserts: true
        order_updates: true
        hbm2ddl:
          create_namespaces: true
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 100

  jackson:
    time-zone: Asia/Seoul

  ai:
    retry:
      max-attempts: 1
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash-lite
          # temperature/top_p/top_k은 Gemini 3.x에서 사용하지 않음
          max-tokens: 2048

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s

  security:
    oauth2:
      client:
        registration:
          kakao: # registrationId
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://bcs.inwoohub.com/login/oauth2/code/{registrationId}"
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# Swagger
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    url: /v3/api-docs
    config-url: /v3/api-docs/swagger-config

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    root: info

# 운영 지표.
#
# 관리 엔드포인트는 서비스 포트에서 갈라 둔다. 8081 은 도커 compose 에서 publish 하지 않으므로
# 바깥에서는 닿지 않고 같은 네트워크에 있는 수집기만 긁는다. 인증을 걸지 않는 것도 그래서다
# (SecurityConfig.managementSecurityFilterChain) — 스크레이퍼는 우리 JWT 를 붙일 수단이 없다.
management:
  server:
    port: 8081

  endpoints:
    web:
      exposure:
        # 기본값은 health 하나뿐이라 적어 두지 않으면 /actuator/prometheus 가 404 다
        include: health,metrics,prometheus

  endpoint:
    health:
      # 관리 포트가 내부 전용이라 상세를 가릴 이유가 없다. 서비스 포트로 옮긴다면 이 줄부터 다시 볼 것
      show-details: always

  metrics:
    tags:
      application: bcs

    distribution:
      # 버킷째로 내보낸다. 앱이 미리 계산한 분위수(distribution.percentiles)를 쓰지 않는 이유는 두 가지다.
      # 하나는 그 값이 인스턴스마다 따로 계산된 것이라 여러 대를 합칠 수 없다는 것이고,
      # 다른 하나는 Prometheus 노출 형식상 히스토그램과 분위수가 한 지표에 같이 실리지 못한다는 것이다
      # (히스토그램을 켜면 분위수 쪽이 조용히 버려진다). p95 는 수집기에서 histogram_quantile 로 센다.
      percentiles-histogram:
        http.server.requests: true

      # 버킷은 이 범위 안에서만 만든다 — 못을 박지 않으면 나노초부터 분 단위까지 깔려 시계열이 불어난다
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

      # 이 경계들의 버킷이 정확히 그 값에 하나씩 더 생긴다. "1초 안에 답한 비율" 같은 목표를 세울 자리다
      slo:
        http.server.requests: 100ms, 300ms, 1s, 3s

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://bcs.inwoohub.com}
  backend-base-url: ${BACKEND_BASE_URL:https://bcs.inwoohub.com}

  image-upload:
    # 컨테이너 내부 경로다. Ubuntu 호스트 경로는 Docker 볼륨으로 연결한다.
    root-directory: ${BCS_UPLOAD_DIR:/app/uploads}
    max-file-size: ${BCS_IMAGE_MAX_SIZE:5MB}
    max-width: ${BCS_IMAGE_MAX_WIDTH:12000}
    max-height: ${BCS_IMAGE_MAX_HEIGHT:12000}
    webp-info-command: ${BCS_WEBPINFO_COMMAND:webpinfo}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 14d

  auth:
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Lax
      path: /api/auth

    oauth:
      exchange-code-ttl: 60s