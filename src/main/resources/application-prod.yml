server:
  forward-headers-strategy: framework

spring:
  application:
    name: bcs

  threads:
    virtual:
      enabled: true # 가상 스레드 On

  mvc:
    problemdetails:
      enabled: true # Spring 기본 예외도 ProblemDetail로 응답

  # 대상지 파일 업로드 — 기본값(파일 1MB·요청 10MB)은 2천 점짜리 대상지에 못 미친다
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        default_schema: bcs
        format_sql: true
        use_sql_comments: true
        # 대상지 파일 임포트는 한 번에 수천 행을 넣는다 — 묶어 보내지 않으면 행마다 왕복한다
        order_inserts: true
        order_updates: true
        hbm2ddl:
          create_namespaces: true
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 100

  jackson:
    time-zone: Asia/Seoul

  ai:
    retry:
      max-attempts: 1
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash-lite
          # temperature/top_p/top_k은 Gemini 3.x에서 사용하지 않음
          max-tokens: 2048

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://bcs.inwoohub.com/login/oauth2/code/{registrationId}"
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# Swagger
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    url: /v3/api-docs
    config-url: /v3/api-docs/swagger-config

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    root: info

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://bcs.inwoohub.com}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 14d

  auth:
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Lax
      path: /api/auth