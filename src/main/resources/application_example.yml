spring:
  application:
    name: bcs

  threads:
    virtual:
      enabled: true # 가상 스레드 On

  mvc:
    problemdetails:
      enabled: true # Spring 기본 예외(404·405 등)도 ProblemDetail(RFC 9457)로 응답

  datasource:
    url:
    username:
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false # API 서버라 뷰 렌더링 없음 — 요청 내내 커넥션을 잡아두는 OSIV 비활성화
    hibernate:
      ddl-auto: create # 개발 단계: 기동마다 스키마 드롭 후 재생성
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          create_namespaces: true # @Table(schema="bcs")의 스키마가 없으면 생성
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul # java.time 직렬화 타임존 — DB에서 UTC로 읽힌 시각도 응답은 +09:00으로

  ai:
    retry:
      max-attempts: 1 # 동기 챗봇 경로라 재시도 없이 1회로 fast-fail — 기본 10회 재시도는 실패 응답을 분 단위로 지연시켜 클라이언트 타임아웃을 넘기고 호출 쿼터만 소진한다
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai # Gemini의 OpenAI 호환 엔드포인트
      api-key: ${GEMINI_API_KEY} # Google AI Studio 발급 키 — 환경변수로 주입
      chat:
        completions-path: /chat/completions # 기본값 /v1/chat/completions는 base-url의 /v1beta/openai와 겹쳐 경로가 깨짐 → 재정의
        options:
          model: gemini-3.5-flash-lite # 무료 티어 성능·사용량 균형 + function calling 지원
          temperature: 0.0 # 도구 호출 안정화
          max-tokens: 2048

  http:
    clients: # Boot 4.0부터 spring.http.client(단수)는 deprecated → clients(복수)
      connect-timeout: 5s # LLM API 연결(TCP·DNS) 대기 상한 — 연결 단계 문제 시 빠르게 실패
      read-timeout: 20s # LLM 생성 상한 — 무응답 요청이 스레드를 오래 붙잡지 않게(체감 대기 한계)

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# Swagger
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    root: info

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}