# Docker-compose.yml
# 실제 서버와 맞게 postgreSQL 버전 동일
# Spring 은 개발 시 직접 ./gradlew bootRun 으로 띄우는게 더 빠름으로 제외

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: bcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: "admin"
      PGDATA: /var/lib/postgresql/18/docker
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: bcs-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.3.0
    container_name: bcs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.5.5
    container_name: bcs-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.9.2
    container_name: bcs-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Docker 컨테이너 로그 접근
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Docker 메타데이터 접근
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 어디까지 읽었는지 표기
      - alloy_data:/var/lib/alloy

    depends_on:
      - loki

  n8n:
    image: n8nio/n8n:latest
    container_name: bcs-n8n
    restart: always

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      - TZ=Asia/Seoul

      # 기본 인증
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin

      # 외부 URL
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - main-net


volumes:
  postgres18_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  n8n_data: